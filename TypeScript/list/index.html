<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List</title>
    <link rel="stylesheet" href="/src/css/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body class="bg-slate-800">
    <main class="m-3 p-6 max-w-md max-h-screen mx-auto bg-slate-700 rounded-xl">
      <h1 class="text-3xl text-left text-gray-300">To do list</h1>
      <hr />
      <section class="my-2 p-2 border-solid border-gray-300 border-opacity-80 border rounded-md">
        <h2 class="-left-80 absolute">New item</h2>
        <form id="entryItemForm" class="flex justify-between">
          <label for="newItem" class="absolute -left-80">Enter new item</label>
          <input id="newItem" type="text" placeholder="Add item" class="p-1 w-11/12 text-2xl rounded-md">
          <button id="addItem" aria-label="Add new item" 
                  class="ml-1 w-1/12 text-gray-300 border rounded-md text-2xl cursor-pointer hover:text-blue-400">+</button>
        </form>
      </section>
      
      <section class="my-2 p-2 border-solid border-gray-300 border-opacity-80 border rounded-md">
        <header class="flex justify-between">
          <h2 class="pt-2.5 text-gray-300 text-left text-3xl">List</h2>
          <button id="clearItems" class="my-2 border rounded-md py-1 px-2 text-gray-300 cursor-pointer hover:text-blue-400">Clear</button>
        </header>
        <hr />
        <ul id="listItems">
          <!-- <li>
            <input id="1" type="checkbox">
            <label for="1">item1</label>
            <button>X</button>
          </li>
          <li>
            <input id="2" type="checkbox">
            <label for="2">item2</label>
            <button>X</button>
          </li>
          <li>
            <input id="3" type="checkbox">
            <label for="3">item3</label>
            <button>X</button>
          </li> -->
        </ul>
      </section>
    </main>
  </body>
</html>
